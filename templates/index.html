<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Acil Sağlık Bilgisi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">

    <div class="alert">ACİL SAĞLIK BİLGİSİ</div>

    <div class="section">
      <div class="label">Ad:</div>
      <div id="name">—</div>
    </div>

    <div class="section">
      <div class="label">Kan Grubu:</div>
      <div id="blood_type">—</div>
    </div>

    <div class="section">
      <div class="label">Alerjiler:</div>
      <div id="alergies">—</div>
    </div>

    <div class="section">
      <div class="label">Acil İletişim:</div>
      <a id="tell_no">Ara</a>
    </div>

    <button class="button" id="edit_button">Bilgileri Düzenlemek İstiyorum</button>

    <form id="password_form" class="hidden">
      <div class="section">
        <div class="label">Şifre</div>
        <input type="text" id="password_input" placeholder="Şifreyi giriniz...">
        <input type="submit" value="Gir">
        <p id="error" style="color:red;" class="hidden">Şifre yanlış</p>
      </div>
    </form>

    <form id="edit_form" class="hidden">
      <div class="section">
        <div class="label">Ad:</div>
        <input type="text" id="name_input" placeholder="Yeni ismi giriniz...">
      </div>

      <div class="section">
        <div class="label">Kan Grubu:</div>
        <input type="text" id="blood_type_input" placeholder="Yeni kan grubu giriniz...">
      </div>

      <div class="section">
        <div class="label">Alerjiler:</div>
        <input type="text" id="alergies_input" placeholder="Yeni alerji giriniz...">
      </div>

      <div class="section">
        <div class="label">Acil İletişim:</div>
        <input type="tel" id="cell_no_input" placeholder="Yeni acil iletişim numarası giriniz...">
      </div>

      <input type="submit" value="Bitti">
    </form>

  </div>

<script>
const btn = document.getElementById("edit_button");
const passwordForm = document.getElementById("password_form");
const editForm = document.getElementById("edit_form");

const passwordInput = document.getElementById("password_input");
const error = document.getElementById("error");

const nameText = document.getElementById("name");
const bloodText = document.getElementById("blood_type");
const alergiesText = document.getElementById("alergies");
const telLink = document.getElementById("tell_no");

const nameInput = document.getElementById("name_input");
const bloodInput = document.getElementById("blood_type_input");
const alergiesInput = document.getElementById("alergies_input");
const telInput = document.getElementById("cell_no_input");

const pageId = window.location.pathname.split("/").pop();

btn.addEventListener("click", () => {
  passwordForm.classList.toggle("hidden");
  error.classList.add("hidden");
  passwordInput.value = "";
});

passwordForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const response = await fetch(`/api/verify_password/${pageId}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: passwordInput.value })
  });

  const result = await response.json();

  if(result.success){
    passwordForm.classList.add("hidden");
    editForm.classList.remove("hidden");
    error.classList.add("hidden");
  } else {
    error.textContent = "Şifre yanlış";
    error.classList.remove("hidden");
  }
});

editForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const updatedData = {
    name: nameInput.value || "—",
    blood_type: bloodInput.value || "—",
    allergies: alergiesInput.value || "—",
    emergency_phone: telInput.value || "—"
  };

  await fetch(`/api/user/${pageId}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(updatedData)
  });

  nameText.textContent = updatedData.name;
  bloodText.textContent = updatedData.blood_type;
  alergiesText.textContent = updatedData.allergies;
  telLink.textContent = updatedData.emergency_phone;

  editForm.classList.add("hidden");
});

window.addEventListener("load", async () => {
  const response = await fetch(`/api/user/${pageId}`);
  const data = await response.json();

  if (!data.error) {
    nameText.textContent = data.name || "—";
    bloodText.textContent = data.blood_type || "—";
    alergiesText.textContent = data.allergies || "—";
    telLink.textContent = data.emergency_phone || "—";
  }
});
</script>
</body>
</html>
